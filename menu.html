<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Hub - Menu</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/bouncer.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --tuxedo-black: #1a1a1a; --tuxedo-white: #ffffff; --nature-green: #4a7c59; --wood: #8b5a2b; --bg: #f0f2f0; --card-bg: #ffffff; --text: #2c362c; }
        body { font-family: 'Nunito', sans-serif; padding: 20px; max-width: 550px; margin: 0 auto; background: var(--bg); color: var(--text); text-align: center; }
        .emojis { font-size: 2.5rem; letter-spacing: 15px; margin-bottom: 10px; margin-top: 30px;}
        h1 { font-family: 'Merriweather', serif; color: var(--tuxedo-black); margin-bottom: 20px; }
        .logout-btn { background: none; border: none; color: #d9534f; font-weight: bold; cursor: pointer; margin-bottom: 20px; font-size: 16px; }
        .logout-btn:hover { text-decoration: underline; }
        .menu-card { background: var(--card-bg); padding: 30px 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08); margin-bottom: 20px; border-top: 6px solid var(--tuxedo-black); border-bottom: 3px solid var(--wood); display: flex; flex-direction: column; gap: 15px; }
        .menu-btn { background: var(--tuxedo-black); color: var(--tuxedo-white); border: 2px solid var(--tuxedo-black); padding: 16px 20px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; font-family: 'Nunito', sans-serif; transition: all 0.3s ease; display: block; width: 100%; box-sizing: border-box; }
        .menu-btn:hover { background: var(--nature-green); border-color: var(--nature-green); transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="emojis">🎹 🌿 🎷</div>
    <h1>Studio Hub</h1>
<button onclick="window.supabaseClient.auth.signOut().then(() => window.location.href='index.html')" class="logout-btn">Log Out</button>

    <div class="menu-card">
        <button onclick="window.location.href='onboarding.html'" class="menu-btn">👋 New Customer Onboarding</button>
        <button onclick="window.location.href='logger.html'" class="menu-btn">📝 Log a Lesson</button>
        <button onclick="window.location.href='students.html'" class="menu-btn">📋 Student Directory</button>
        <button onclick="window.location.href='billing.html'" class="menu-btn">💰 Billing Dashboard</button>
    </div>
</body>
</html>
