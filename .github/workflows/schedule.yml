name: Sync GoCardless Payments

on:
  schedule:
    - cron: '0 2 * * *' # Runs at 02:00 UTC daily
  workflow_dispatch: # Adds a button so you can run it manually anytime

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gocardless_pro supabase
          
      - name: Run sync script
        env:
          GOCARDLESS_TOKEN: ${{ secrets.GOCARDLESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python sync_payments.py
