<!DOCTYPE html>
<html>
<head>
    <title>Onboarding - Studio Hub</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/bouncer.js"></script>
    
    <!-- EmailJS Library -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // REPLACE WITH YOUR EMAILJS PUBLIC KEY
            emailjs.init("YOUR_EMAILJS_PUBLIC_KEY");
        })();
        
        function sendMandateEmail() {
            var templateParams = {
                customer_name: document.getElementById('custName').value,
                customer_email: document.getElementById('custEmail').value,
                mandate_link: 'YOUR_GOCARDLESS_LINK'
            };
            
            // REPLACE WITH YOUR SERVICE ID AND TEMPLATE ID
            emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', templateParams)
                .then(function(response) {
                    alert("Mandate email sent successfully!");
                }, function(error) {
                    alert("Failed to send email. Check console for details.");
                    console.log(error);
                });
        }
    </script>
</head>
<body>
    <div class="container">
        <nav>
            <button onclick="window.location.href='billing.html'">Billing</button>
            <button onclick="window.location.href='students.html'">Students</button>
            <button onclick="window.location.href='logger.html'">Logger</button>
            <button onclick="window.location.href='onboarding.html'">Onboarding</button>
            <button onclick="logout()" style="float: right; background: #c0392b;">Logout</button>
        </nav>
        <h2>Send Mandate Setup Email</h2>
        <div class="form-group">
            <input type="text" id="custName" placeholder="Customer Name">
        </div>
        <div class="form-group">
            <input type="email" id="custEmail" placeholder="Customer Email">
        </div>
        <button onclick="sendMandateEmail()">Send Mandate Email via EmailJS</button>
    </div>
</body>
</html>
